<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VS to PDF Saver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">

  <header>
    <span class="logo">VS</span>
    <span class="app-name">to PDF Saver</span>
  </header>

  <!-- Shown when not on a VitalSource page -->
  <div id="panel-not-vs" class="panel" hidden>
    <p class="hint">Open a VitalSource book in the reader, then click this extension.</p>
    <a href="https://bookshelf.vitalsource.com" target="_blank" class="btn btn-outline">
      Open VitalSource
    </a>
  </div>

  <!-- Main capture UI -->
  <div id="panel-main" class="panel" hidden>

    <div class="book-card">
      <div class="book-title" id="book-title">Loading…</div>
      <div class="book-meta" id="book-meta">—</div>
    </div>

    <div class="form-group">
      <label>Page Range</label>
      <div class="range-row">
        <input type="number" id="start-page" min="1" placeholder="From">
        <span class="range-sep">–</span>
        <input type="number" id="end-page" min="1" placeholder="To">
      </div>
    </div>

    <div class="form-group">
      <label>
        Delay between pages:
        <strong id="delay-label">1.5 s</strong>
      </label>
      <input type="range" id="delay-slider" min="500" max="5000" step="250" value="1500">
      <div class="range-hints"><span>0.5 s</span><span>5 s</span></div>
    </div>

    <label class="check-row">
      <input type="checkbox" id="crop-toggle" checked>
      Crop to book content area
    </label>

    <div class="btn-row">
      <button id="btn-start" class="btn btn-primary">Start Capture</button>
      <button id="btn-stop" class="btn btn-danger" hidden>Stop</button>
    </div>

    <!-- Progress -->
    <div id="capture-progress" hidden>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-label" id="progress-label">0 / 0 pages</div>
      <div class="status-line" id="status-line"></div>
    </div>

    <!-- Done -->
    <div id="capture-done" hidden>
      <div class="done-badge">✓ <span id="done-count">0</span> pages captured</div>
      <button id="btn-save" class="btn btn-success btn-full">Save PDF</button>
      <button id="btn-restart" class="btn btn-ghost btn-full">Capture Again</button>
    </div>

  </div>

  <!-- Error panel -->
  <div id="panel-error" class="panel" hidden>
    <div class="error-icon">⚠</div>
    <p class="error-msg" id="error-msg"></p>
    <button id="btn-back" class="btn btn-outline">← Back</button>
  </div>

</div>
<script src="lib/jspdf.umd.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
